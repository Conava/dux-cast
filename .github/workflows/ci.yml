name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.25 patch release, for its security fixes.
          go-version: "1.25"
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  # A tag vX.Y.Z publishes the helper; it has to match the version in main.go.
  # Asset names follow `uname -m`, which the download commands use.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          check-latest: true
      - name: Check the tag matches main.go
        run: |
          grep -q "^const version = \"${GITHUB_REF_NAME#v}\"$" main.go || { echo "tag $GITHUB_REF_NAME doesn't match main.go"; exit 1; }
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64:x86_64 arm64:aarch64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch%%:*} go build -trimpath -ldflags "-s -w" -o "dist/cast-helper-${arch##*:}" .
          done
          (cd dist && sha256sum cast-helper-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "cast-helper binaries, built from this tag."
